version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production

  db:
    image: postgres:latest
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    volumes:
      - ./services/ai-service:/app

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    volumes:
      - ./services/analytics-service:/app

  gpay-parser-service:
    build:
      context: ./services/gpay-parser-service
      dockerfile: Dockerfile
    volumes:
      - ./services/gpay-parser-service:/app

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    volumes:
      - ./services/notification-service:/app

  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile
    volumes:
      - ./services/ocr-service:/app

  report-service:
    build:
      context: ./services/report-service
      dockerfile: Dockerfile
    volumes:
      - ./services/report-service:/app

volumes:
  db_data: