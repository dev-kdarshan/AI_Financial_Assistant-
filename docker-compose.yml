services:

  # ==============================
  # FRONTEND
  # ==============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped


  # ==============================
  # BACKEND
  # ==============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production

      PORT: 5000

      # PostgreSQL
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DIALECT: postgres

      # Authentication
      JWT_SECRET: ${JWT_SECRET}

      # Microservices
      OCR_SERVICE_URL: http://ocr-service:5000
      GPAY_SERVICE_URL: http://gpay-parser-service:5000
      AI_SERVICE_URL: http://ai-service:5000
      ANALYTICS_SERVICE_URL: http://analytics-service:5000
      NOTIFICATION_SERVICE_URL: http://notification-service:5000
      REPORT_SERVICE_URL: http://report-service:5000

    depends_on:
      db:
        condition: service_healthy

      ai-service:
        condition: service_started

      analytics-service:
        condition: service_started

      gpay-parser-service:
        condition: service_started

      notification-service:
        condition: service_started

      ocr-service:
        condition: service_started

      report-service:
        condition: service_started

    restart: unless-stopped


  # ==============================
  # POSTGRESQL DATABASE
  # ==============================
  db:
    image: postgres:16

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    volumes:
      - db_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]

      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  # ==============================
  # REDIS
  # ==============================
  redis:
    image: redis:7-alpine

    volumes:
      - redis_data:/data

    restart: unless-stopped


  # ==============================
  # AI SERVICE
  # ==============================
  ai-service:
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile

    volumes:
      - chroma_data:/app/chroma_db

    restart: unless-stopped


  # ==============================
  # ANALYTICS SERVICE
  # ==============================
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile

    restart: unless-stopped


  # ==============================
  # GPAY PARSER SERVICE
  # ==============================
  gpay-parser-service:
    build:
      context: ./services/gpay-parser-service
      dockerfile: Dockerfile

    restart: unless-stopped


  # ==============================
  # NOTIFICATION SERVICE
  # ==============================
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile

    environment:
      REDIS_URL: redis://redis:6379/0

    depends_on:
      - redis

    restart: unless-stopped


  # ==============================
  # OCR SERVICE
  # ==============================
  ocr-service:
    build:
      context: ./services/ocr-service
      dockerfile: Dockerfile

    restart: unless-stopped


  # ==============================
  # REPORT SERVICE
  # ==============================
  report-service:
    build:
      context: ./services/report-service
      dockerfile: Dockerfile

    restart: unless-stopped


# ==============================
# PERSISTENT VOLUMES
# ==============================

volumes:

  # PostgreSQL data
  db_data:

  # ChromaDB vector database
  chroma_data:

  # Redis data
  redis_data: